<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Daily Audio Practice</title>
<style>
  :root {
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #1f2723;
    --muted: #65716b;
    --line: #dfe5dc;
    --green: #2f6f55;
    --green-dark: #1f543f;
    --gold: #b9822b;
    --blue: #2d638f;
    --shadow: 0 14px 36px rgba(31, 39, 35, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }

  button {
    font: inherit;
  }

  .shell {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    min-height: 100vh;
  }

  aside {
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 28px 18px;
    background: #eef2ec;
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }

  .brand {
    margin-bottom: 24px;
  }

  .brand h1 {
    margin: 0 0 8px;
    font-size: 24px;
    line-height: 1.15;
  }

  .brand p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }

  .date-list {
    display: grid;
    gap: 10px;
  }

  .date-button {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    padding: 12px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }

  .date-button.active {
    border-color: var(--green);
    background: #e2eee7;
    box-shadow: inset 4px 0 0 var(--green);
  }

  .date-button strong {
    display: block;
    font-size: 16px;
  }

  .date-button span {
    display: block;
    color: var(--muted);
    font-size: 13px;
  }

  main {
    max-width: 1060px;
    width: 100%;
    padding: 30px 24px 80px;
    margin: 0 auto;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
    padding: 14px 0;
    background: rgba(246, 247, 244, 0.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(10px);
  }

  .tabs,
  .actions,
  .card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .tab-button,
  .action-button {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    min-height: 38px;
    padding: 8px 12px;
    color: var(--ink);
    cursor: pointer;
  }

  .tab-button.active {
    border-color: var(--blue);
    background: #e7f0f7;
    color: #174360;
  }

  .action-button.primary {
    border-color: var(--green);
    background: var(--green);
    color: white;
  }

  .action-button.warning {
    border-color: #d6c4a5;
    background: #fff7e8;
    color: #6f4712;
  }

  .hero {
    padding: 26px 0 16px;
  }

  .hero h2 {
    margin: 0 0 6px;
    font-size: 30px;
    line-height: 1.2;
  }

  .hero p {
    margin: 0;
    color: var(--muted);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin: 14px 0 22px;
  }

  .stat {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
  }

  .stat strong {
    display: block;
    font-size: 22px;
  }

  .stat span {
    color: var(--muted);
    font-size: 13px;
  }

  .section-title {
    margin: 28px 0 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--line);
    font-size: 20px;
  }

  .grid {
    display: grid;
    gap: 12px;
  }

  .card,
  .sentence-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 15px 16px;
    box-shadow: 0 1px 4px rgba(31, 39, 35, 0.03);
  }

  .card-top,
  .sentence-top {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }

  .word-line,
  .sentence-text {
    flex: 1 1 360px;
    min-width: 0;
  }

  .num {
    color: var(--muted);
    margin-right: 6px;
    font-weight: 700;
  }

  .ipa {
    color: var(--muted);
    margin-left: 6px;
  }

  .meaning {
    color: var(--green-dark);
  }

  .example {
    margin: 10px 0 0;
    color: #39433e;
  }

  .clean-text {
    white-space: pre-wrap;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
  }

  .empty-state {
    background: var(--paper);
    border: 1px dashed #c8d2c8;
    border-radius: 8px;
    padding: 18px;
    color: var(--muted);
  }

  .hidden {
    display: none;
  }

  @media (max-width: 820px) {
    .shell {
      display: block;
    }

    aside {
      position: static;
      height: auto;
      padding: 20px 16px 12px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }

    .date-list {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    main {
      padding: 18px 16px 60px;
    }

    .topbar {
      top: 0;
    }

    .hero h2 {
      font-size: 24px;
    }

    .stats {
      grid-template-columns: 1fr;
    }

    .card-actions,
    .card-actions .action-button {
      width: 100%;
    }

    .card-actions .action-button,
    .sentence-top .action-button {
      justify-content: center;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <h1>IELTS Daily Audio Practice</h1>
      <p>按学习日期管理单词背诵发音和文章单句跟读。</p>
    </div>
    <div class="date-list" id="dateList"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="tabs">
        <button class="tab-button active" type="button" data-tab="vocabulary">单词发音</button>
        <button class="tab-button" type="button" data-tab="sentences">文章单句</button>
      </div>
      <div class="actions">
        <button class="action-button primary" type="button" id="playCurrent">Play Current</button>
        <button class="action-button warning" type="button" id="stopAudio">Stop</button>
      </div>
    </div>

    <section class="hero">
      <h2 id="studyTitle"></h2>
      <p id="studyMeta"></p>
    </section>

    <section class="stats" aria-label="learning stats">
      <div class="stat"><strong id="wordCount">0</strong><span>单词</span></div>
      <div class="stat"><strong id="sentenceCount">0</strong><span>文章句子</span></div>
      <div class="stat"><strong id="topicCount">0</strong><span>单词主题</span></div>
    </section>

    <section id="vocabularyPanel"></section>
    <section id="sentencesPanel" class="hidden"></section>
  </main>
</div>

        category: "六、运动、身体与个性化训练表达",
        words: [
          { word: "Triathlete", ipa: "/traɪˈæθliːt/", meaning: "铁人三项运动员；替换原日记中的“铁人三项运动员”", example: "As a seasoned triathlete, he has a deep understanding of human limits." },
          { word: "Genetic", ipa: "/dʒəˈnetɪk/", meaning: "基因的；遗传的；替换原日记中的“Gene”", example: "Our genetic makeup plays a crucial role in determining our physical potential." },
          { word: "Skeletal structure", ipa: "/ˈskelɪtl ˈstrʌktʃər/", meaning: "骨骼结构；替换原日记中的“Bone shapes”", example: "The AI analyzes your skeletal structure to prevent injuries during high-intensity training." },
          { word: "Anatomical", ipa: "/ˌænəˈtɑːmɪkl/", meaning: "解剖学的；身体结构上的；可用于概括肢体长度等身体构造数据", example: "By inputting anatomical measurements, such as limb length, the AI can customize a workout plan." },
          { word: "Tailor-made", ipa: "/ˌteɪlər ˈmeɪd/", meaning: "定制的；完全合适的；替换 Most suitable / Perfectly suited", example: "It is fascinating to think that AI can provide a tailor-made exercise routine for every individual." }
        ]
      },
      {
        category: "七、反脆弱与职业选择表达",
        words: [
          { word: "Volatility", ipa: "/ˌvɑːləˈtɪləti/", meaning: "波动；易变性；替换原日记中的“Uncertainty”", example: "Instead of fearing volatility, we should learn how to thrive in an unpredictable environment." },
          { word: "Conventional", ipa: "/kənˈvenʃənl/", meaning: "传统的；常规的；可形容传统稳定职业路径", example: "My mother prefers a conventional career path, believing it offers the most security." },
          { word: "Intrinsic", ipa: "/ɪnˈtrɪnzɪk/", meaning: "本质的；固有的；替换 Nothing is stable 的抽象表达", example: "I argue that instability is intrinsic to the modern job market." },
          { word: "Inherent", ipa: "/ɪnˈherənt/", meaning: "内在的；生来就有的；常用于 inherent risks", example: "I firmly believe that significant opportunities always come with inherent risks." },
          { word: "Resilience", ipa: "/rɪˈzɪliəns/", meaning: "韧性；复原力；可表达承受压力并恢复的能力", example: "I want to demonstrate to my mother that I have the resilience to handle life's challenges." }
        ]
      }
    ],
    article: {
      title: "No article sentences yet",
      sentences: []
    }
  }
];

let currentDateIndex = studyData.length - 1;
let currentTab = "vocabulary";

const dateList = document.getElementById("dateList");
const vocabularyPanel = document.getElementById("vocabularyPanel");
const sentencesPanel = document.getElementById("sentencesPanel");
const studyTitle = document.getElementById("studyTitle");
const studyMeta = document.getElementById("studyMeta");
const wordCount = document.getElementById("wordCount");
const sentenceCount = document.getElementById("sentenceCount");
const topicCount = document.getElementById("topicCount");

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getCurrentStudy() {
  return studyData[currentDateIndex];
}

function getAllWords(study) {
  return study.vocabulary.flatMap(group => group.words);
}

function renderDates() {
  dateList.innerHTML = studyData.map((study, index) => {
    const words = getAllWords(study).length;
    const sentences = study.article.sentences.length;
    return `
      <button class="date-button ${index === currentDateIndex ? "active" : ""}" type="button" data-date-index="${index}">
        <strong>${escapeHtml(study.label)}</strong>
        <span>${words} 个单词 / ${sentences} 个句子</span>
      </button>
    `;
  }).join("");
}

function renderVocabulary(study) {
  let runningNumber = 1;
  vocabularyPanel.innerHTML = study.vocabulary.map(group => {
    const cards = group.words.map(item => {
      const number = runningNumber++;
      return `
        <article class="card">
          <div class="card-top">
            <div class="word-line">
              <span class="num">${number}.</span>
              <strong>${escapeHtml(item.word)}</strong>
              <span class="ipa">${escapeHtml(item.ipa)}</span>
              <span class="meaning">｜${escapeHtml(item.meaning)}</span>
            </div>
            <div class="card-actions">
              <button class="action-button" type="button" data-speak="${escapeHtml(item.word)}" data-rate="0.78">Word</button>
              <button class="action-button" type="button" data-speak="${escapeHtml(item.example)}" data-rate="0.82">Example</button>
            </div>
          </div>
          <p class="example"><strong>Example:</strong> ${escapeHtml(item.example)}</p>
        </article>
      `;
    }).join("");

    return `
      <h3 class="section-title">${escapeHtml(group.category)}</h3>
      <div class="grid">${cards}</div>
    `;
  }).join("");
}

function renderSentences(study) {
  if (study.article.sentences.length === 0) {
    sentencesPanel.innerHTML = `
      <h3 class="section-title">${escapeHtml(study.article.title)}</h3>
      <div class="empty-state">今天还没有添加文章单句。你发来文章或句子后，我可以继续按这个日期追加逐句发音背诵。</div>
    `;
    return;
  }

  const sentenceCards = study.article.sentences.map((sentence, index) => `
    <article class="sentence-card">
      <div class="sentence-top">
        <div class="sentence-text"><span class="num">${index + 1}.</span>${escapeHtml(sentence)}</div>
        <button class="action-button" type="button" data-speak="${escapeHtml(sentence)}" data-rate="0.82">Play</button>
      </div>
    </article>
  `).join("");

  const cleanText = study.article.sentences
    .map((sentence, index) => `${index + 1}. ${sentence}`)
    .join("\n");

  sentencesPanel.innerHTML = `
    <h3 class="section-title">${escapeHtml(study.article.title)}</h3>
    <div class="grid">${sentenceCards}</div>
    <h3 class="section-title">Clean Practice Text</h3>
    <pre class="clean-text">${escapeHtml(cleanText)}</pre>
  `;
}

function renderStudy() {
  const study = getCurrentStudy();
  const words = getAllWords(study);
  studyTitle.textContent = study.title;
  studyMeta.textContent = `${study.label} · ${study.sourceNote}`;
  wordCount.textContent = words.length;
  sentenceCount.textContent = study.article.sentences.length;
  topicCount.textContent = study.vocabulary.length;
  renderDates();
  renderVocabulary(study);
  renderSentences(study);
  updateTabVisibility();
}

function updateTabVisibility() {
  document.querySelectorAll(".tab-button").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === currentTab);
  });
  vocabularyPanel.classList.toggle("hidden", currentTab !== "vocabulary");
  sentencesPanel.classList.toggle("hidden", currentTab !== "sentences");
}

function getVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(voice => voice.lang === "en-US") ||
    voices.find(voice => voice.lang.startsWith("en")) ||
    null;
}

function speak(text, rate = 0.82, cancelFirst = true) {
  if (cancelFirst) speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = rate;
  utterance.pitch = 1;
  const voice = getVoice();
  if (voice) utterance.voice = voice;
  speechSynthesis.speak(utterance);
}

function playCurrent() {
  speechSynthesis.cancel();
  const study = getCurrentStudy();
  const voice = getVoice();
  const items = currentTab === "vocabulary"
    ? getAllWords(study).map(item => ({ text: item.word, rate: 0.78 }))
    : study.article.sentences.map(sentence => ({ text: sentence, rate: 0.82 }));

  items.forEach(item => {
    const utterance = new SpeechSynthesisUtterance(item.text);
    utterance.lang = "en-US";
    utterance.rate = item.rate;
    utterance.pitch = 1;
    if (voice) utterance.voice = voice;
    speechSynthesis.speak(utterance);
  });
}

dateList.addEventListener("click", event => {
  const button = event.target.closest("[data-date-index]");
  if (!button) return;
  currentDateIndex = Number(button.dataset.dateIndex);
  speechSynthesis.cancel();
  renderStudy();
});

document.querySelector(".tabs").addEventListener("click", event => {
  const button = event.target.closest("[data-tab]");
  if (!button) return;
  currentTab = button.dataset.tab;
  speechSynthesis.cancel();
  updateTabVisibility();
});

document.addEventListener("click", event => {
  const button = event.target.closest("[data-speak]");
  if (!button) return;
  speak(button.dataset.speak, Number(button.dataset.rate || 0.82));
});

document.getElementById("playCurrent").addEventListener("click", playCurrent);
document.getElementById("stopAudio").addEventListener("click", () => speechSynthesis.cancel());

if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = getVoice;
}

renderStudy();
</script>
</body>
</html>
